<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected By R.A.S Cyber Team</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(120deg, #232526 0%, #0d6efd 100%);
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      position: relative;
    }
    .particles {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    .glass {
      background: rgba(30, 34, 90, 0.10);
      border-radius: 2rem;
      box-shadow: 0 8px 32px 0 rgba(13, 110, 253, 0.08), 0 1.5px 8px 0 rgba(0,0,0,0.04);
      backdrop-filter: blur(18px) saturate(120%);
      -webkit-backdrop-filter: blur(18px) saturate(120%);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      text-align: center;
      max-width: 440px;
      width: 100%;
      margin: 6vh auto 0 auto;
      position: relative;
      z-index: 2;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .shield-animate {
      animation: glow 2s infinite alternate, bounce 2s infinite;
      color: #0d6efd;
      font-size: 5.5rem;
      filter: drop-shadow(0 0 32px #0d6efdcc);
      margin-bottom: 1.5rem;
      margin-top: -2.5rem;
      transition: transform 0.2s;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }
    @keyframes glow {
      0% { filter: drop-shadow(0 0 16px #0d6efd88); }
      100% { filter: drop-shadow(0 0 48px #0d6efdcc); }
    }
    .hero-title, .hero-title .text-primary, .hero-desc, .footer {
      color: #f8fafd !important;
      text-shadow: 0 2px 8px #0004;
    }
    .hero-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }
    .hero-title .text-primary {
      color: #0d6efd !important;
      text-shadow: 0 2px 12px #0d6efd55;
    }
    .hero-desc {
      color: #b0b8c1;
      font-size: 1.13rem;
      margin-bottom: 2rem;
    }
    .badge-custom {
      background: linear-gradient(90deg, #0d6efd 60%, #00c3ff 100%);
      color: #fff;
      font-size: 1rem;
      padding: 0.5em 1.2em;
      border-radius: 1em;
      box-shadow: 0 2px 8px #0d6efd44;
      margin-bottom: 1.5rem;
      display: inline-block;
      letter-spacing: 1px;
      font-weight: 500;
    }
    .footer {
      margin-top: 2.5rem;
      color: #b0b8c1;
      font-size: 1.05rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .footer .social {
      margin-top: 0.2rem;
    }
    .footer .social a {
      color: #0d6efd;
      margin: 0 0.4em;
      font-size: 1.3em;
      transition: color 0.2s;
    }
    .footer .social a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas class="particles"></canvas>
  <main class="glass">
    <span class="badge-custom"><i class="fa-solid fa-lock"></i> Secure Site</span>
    <div class="shield-animate">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <div class="hero-title">Protected By <span class="text-primary">R.A.S Cyber Team</span></div>
    <div class="hero-desc">Your security is our priority.<br>We protect your data with advanced technology and dedication.</div>
    <div class="footer">
      <span><i class="fa-brands fa-galactic-republic"></i> &copy; 2024 R.A.S Cyber Team</span>
      <div class="social">
        <a href="#" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" title="Facebook"><i class="fab fa-facebook"></i></a>
        <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="#" title="Github"><i class="fab fa-github"></i></a>
      </div>
    </div>
  </main>
  <script>
    // Simple animated particles background
    const canvas = document.querySelector('.particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + 1.5,
        d: Math.random() * 1.5 + 0.5,
        dx: (Math.random() - 0.5) * 0.7,
        dy: (Math.random() - 0.5) * 0.7,
        o: Math.random() * 0.5 + 0.3
      });
    }
    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
        ctx.fillStyle = `rgba(13,110,253,${p.o})`;
        ctx.shadowColor = '#0d6efd';
        ctx.shadowBlur = 12;
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
      }
      requestAnimationFrame(drawParticles);
    }
    drawParticles();
  </script>
</body>
</html>
