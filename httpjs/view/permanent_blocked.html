<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permanently Blocked</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #232526 0%, #0d6efd 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .blocked-box {
      background: rgba(255, 0, 0, 0.10);
      border-radius: 2rem;
      box-shadow: 0 8px 32px 0 rgba(255, 0, 0, 0.13), 0 1.5px 8px 0 rgba(0,0,0,0.08);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1.5px solid rgba(255,0,0,0.18);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 100%;
      z-index: 2;
    }
    .blocked-box h1 {
      color: #ff4d4f;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .blocked-box p {
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .btn-home {
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 1em;
      padding: 0.7em 2em;
      font-size: 1.1rem;
      margin-top: 1.5rem;
      transition: background 0.2s;
    }
    .btn-home:hover {
      background: #232526;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="blocked-box">
    <h1>🚫 Permanently Blocked</h1>
    <p>Your IP is <b>permanently blocked</b>.<br>If you believe this is a mistake, please contact the admin.<br><br></p>
    <a href="/" class="btn-home">Go to Homepage</a>
  </div>
</body>
</html>
