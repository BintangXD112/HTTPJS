<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Blocked</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #232526 0%, #0d6efd 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .blocked-box {
      background: rgba(30, 34, 90, 0.13);
      border-radius: 2rem;
      box-shadow: 0 8px 32px 0 rgba(13, 110, 253, 0.13), 0 1.5px 8px 0 rgba(0,0,0,0.08);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1.5px solid rgba(255,255,255,0.18);
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 100%;
      z-index: 2;
    }
    .blocked-box h1 {
      color: #ff4d4f;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .blocked-box p {
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }
    .countdown {
      font-size: 1.5rem;
      color: #0d6efd;
      font-weight: bold;
    }
    .block-count {
      color: #ffb300;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
  </style>
  <meta http-equiv="refresh" content="10;url=/">
</head>
<body>
  <div class="blocked-box">
    <h1>🚫 Access Blocked</h1>
    <p>Your IP is temporarily blocked for <span class="countdown" id="count">10</span> seconds due to suspicious activity.<br>Redirecting soon...</p>
    <div class="block-count">Anda telah terblokir <span id="blockCount">1</span>/3</div>
  </div>
  <script>
    let c = 10;
    setInterval(() => {
      c--;
      if (c >= 0) document.getElementById('count').textContent = c;
    }, 1000);
    // Block count will be set by server-side string replace if needed
  </script>
</body>
</html>
